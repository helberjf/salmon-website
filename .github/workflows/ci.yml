name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, metadata and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Verify infrastructure hardening
        run: npm run verify:infra

      - name: Build and generate localized metadata
        run: npm run build

      - name: Verify generated routes and metadata
        run: node scripts/verify-build.mjs

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Run automated accessibility tests
        if: ${{ !cancelled() }}
        run: npm run test:a11y

      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-artifacts-${{ github.run_id }}
          path: |
            dist/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Reproducible unprivileged container
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build pinned Docker image
        run: docker build --tag bridge-point-site:ci .

      - name: Start unprivileged Nginx
        run: docker run --detach --name bridge-point-site-ci --publish 8080:8080 bridge-point-site:ci

      - name: Verify runtime, redirects and security headers
        shell: bash
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            if [[ "$attempt" == 20 ]]; then
              docker logs bridge-point-site-ci
              exit 1
            fi
            sleep 1
          done

          test "$(docker exec bridge-point-site-ci id -u)" = "101"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:8080/norwell?source=ci')" = "308"
          test "$(curl --silent --output /dev/null --write-out '%{redirect_url}' 'http://127.0.0.1:8080/pt/norwell?source=ci')" = "http://127.0.0.1:8080/pt/a-norwell?source=ci"

          headers="$(curl --silent --head http://127.0.0.1:8080/)"
          grep --ignore-case --quiet "content-security-policy:.*frame-ancestors 'none'" <<<"$headers"
          if grep --ignore-case --quiet '^strict-transport-security:' <<<"$headers"; then
            echo 'The internal HTTP container must not emit HSTS.'
            exit 1
          fi

      - name: Stop test container
        if: always()
        run: docker rm --force bridge-point-site-ci || true
