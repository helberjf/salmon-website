server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;

    location / {
        try_files $uri.html $uri $uri/ =404;
        error_page 404 /index.html;
    }

    location = /index.html {
        expires -1;
    }

    location ^~ /assets/ {
        expires 1y;
    }

    location ~* \.(?:avif|webp|png|jpe?g|svg|ico)$ {
        expires 30d;
    }

    location ~* \.woff2?$ {
        expires 1y;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json application/xml image/svg+xml;
    gzip_min_length 1024;
}
