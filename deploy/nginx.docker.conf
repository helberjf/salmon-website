server {
    # O container recebe somente HTTP em uma rede privada. TLS e HSTS pertencem
    # ao proxy/CDN publico; consulte deploy/nginx.tls.conf.example.
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), publickey-credentials-get=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; child-src 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data:; manifest-src 'self'; media-src 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self'" always;

    # Alias historico: um unico URL canonico evita conteudo duplicado.
    location ~ ^/(a-norwell|norwell)/?$ {
        return 308 /sobre$is_args$args;
    }

    location ~ ^/(pt|en|es|no)/(a-norwell|norwell)/?$ {
        return 308 /$1/sobre$is_args$args;
    }

    location / {
        try_files $uri.html $uri $uri/ =404;
        error_page 404 /index.html;
    }

    location = /index.html {
        expires -1;
    }

    location ^~ /assets/ {
        expires 1y;
    }

    location ~* \.(?:avif|webp|png|jpe?g|svg|ico)$ {
        expires 30d;
    }

    location ~* \.woff2?$ {
        expires 1y;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json application/xml image/svg+xml;
    gzip_min_length 1024;
}
